[project]
name = "figma-parity"
version = "0.1.0"
description = "Figma-to-code with a verified parity loop"
requires-python = ">=3.10"
# Only the pixel diff needs anything third-party. The tree walk, the ledger and
# the completion gate are stdlib-only, so the plugin works with nothing at all.
dependencies = [
    "pillow>=10",
    "numpy>=1.26",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
